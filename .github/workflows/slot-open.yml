name: Slot - open

on:
  schedule:
    # 投稿は18:30〜19:00 JST内のランダム時刻(post_story.py が待機)。
    # 混雑回避のため18:30の25分前、18:05 JST(09:05 UTC)に起動する。
    - cron: "5 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: slot-open
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 起動時に、この後の待機(最大25分)と投稿をスキップすべきか判定する。
      #  (a) 本日分が既に投稿済み       … 外部cron + GitHub内蔵cron の二重起動対策
      #  (b) schedule起動が予定時刻から1時間以上遅れている
      #      … GitHub内蔵cronは大幅に遅延して発火することがあり、その頃には
      #        手動で投稿済みの可能性が高い。手動実行(workflow_dispatch)は対象外。
      # checkout は起動時点のSHAで先行runのコミットを含まないため、
      # last_post.json は最新の origin/main を直接見る。
      - name: Skip if already posted today or too late
        id: dedup
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          git fetch origin main --quiet || true
          POSTED=$(git show FETCH_HEAD:last_post.json 2>/dev/null \
            | python -c "import json,sys; print((json.load(sys.stdin) or {}).get('open',''))" 2>/dev/null || echo "")
          echo "本日(JST)=$TODAY / open の最終投稿日=$POSTED / event=$EVENT_NAME"
          if [ "$POSTED" = "$TODAY" ]; then
            echo "本日分は投稿済み。待機・投稿をスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            TARGET_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 09:30:00" +%s)
            LATE_SEC=$(( $(date -u +%s) - TARGET_EPOCH ))
            if [ "$LATE_SEC" -gt 3600 ]; then
              echo "予定時刻(18:30 JST)から ${LATE_SEC} 秒=1時間超 遅れているためスキップします"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.dedup.outputs.skip != 'true'
        run: pip install requests

      - name: Post story (open)
        if: steps.dedup.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          CLOSED_DAYS_CSV_URL: ${{ secrets.CLOSED_DAYS_CSV_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL_OPEN }}
        run: python post_story.py --slot open

      - name: Commit state files if changed
        if: steps.dedup.outputs.skip != 'true'
        run: |
          if git diff --quiet -- closed_days.txt last_post.json; then
            echo "closed_days.txt / last_post.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # もう一方のスロットが先に push していると、rebase では状態ファイルが競合する。
          # そのため今回の結果を退避し、毎回「最新の origin/main」に書き足してからコミットする。
          cp last_post.json "$RUNNER_TEMP/last_post.json"
          CLOSED_CHANGED=false
          if ! git diff --quiet -- closed_days.txt; then
            CLOSED_CHANGED=true
            cp closed_days.txt "$RUNNER_TEMP/closed_days.txt"
          fi
          for i in 1 2 3; do
            if git fetch origin main && git reset --hard FETCH_HEAD; then
              if [ "$CLOSED_CHANGED" = "true" ]; then
                cp "$RUNNER_TEMP/closed_days.txt" closed_days.txt
              fi
              # last_post.json は自分のスロットの日付だけを反映する(他スロットの記録は残す)
              python - <<'EOF'
          import json, os
          slot = "open"
          with open(os.path.join(os.environ["RUNNER_TEMP"], "last_post.json"), encoding="utf-8") as f:
              mine = json.load(f)
          with open("last_post.json", encoding="utf-8") as f:
              latest = json.load(f)
          if mine.get(slot, "") > latest.get(slot, ""):
              latest[slot] = mine[slot]
              with open("last_post.json", "w", encoding="utf-8", newline="\n") as f:
                  json.dump(latest, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write("\n")
          EOF
              git add closed_days.txt last_post.json
              if git diff --cached --quiet; then
                exit 0
              fi
              if git commit -m "chore: update state files [skip ci]" && git push origin HEAD:main; then
                exit 0
              fi
            fi
            echo "push retry $i"
            sleep 5
          done
          echo "::warning::state files のコミットに失敗しました（次回の実行で再同期されます）"

      - name: Notify on workflow failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NOTIFY_WEBHOOK" ] && exit 0
          # requests を使う（urllib の User-Agent は Discord に 403 で弾かれるため）
          python - <<'EOF'
          import os, requests
          msg = "⚠️ Slot - open のワークフローが失敗しました。\n" + os.environ.get("RUN_URL", "")
          try:
              requests.post(os.environ["NOTIFY_WEBHOOK"], json={"content": msg, "text": msg}, timeout=15)
          except Exception as e:
              print("通知の送信に失敗:", e)
          EOF
