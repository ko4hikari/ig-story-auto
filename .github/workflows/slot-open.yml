name: Slot - open

on:
  schedule:
    # 実際の投稿目標は17:00 JST(08:00 UTC)。
    # ちょうど毎時0分はGitHub Actions全体で混雑し実行が遅延しやすいため、
    # 25分早い16:35 JST(07:35 UTC)に起動し、後続の待機ステップで正確な時刻まで調整する。
    - cron: "35 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: slot-open
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Wait until 17:00 JST (08:00 UTC)
        run: |
          TARGET_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 08:00:00" +%s)
          NOW_EPOCH=$(date -u +%s)
          SLEEP_SEC=$((TARGET_EPOCH - NOW_EPOCH))
          if [ "$SLEEP_SEC" -gt 0 ]; then
            echo "投稿予定時刻まで ${SLEEP_SEC} 秒待機します"
            sleep "$SLEEP_SEC"
          else
            echo "既に予定時刻を過ぎているため、待機せず投稿します"
          fi

      - name: Post story (open)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          CLOSED_DAYS_CSV_URL: ${{ secrets.CLOSED_DAYS_CSV_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL_OPEN }}
        run: python post_story.py --slot open

      - name: Commit state files if changed
        run: |
          if git diff --quiet -- closed_days.txt last_post.json; then
            echo "closed_days.txt / last_post.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add closed_days.txt last_post.json
          git commit -m "chore: update state files [skip ci]"
          # 外部cronとGitHub cronの併用で push が競合しうるため、rebase して数回リトライする。
          # 競合が解消できなくてもジョブは失敗させない（状態ファイルは次回実行で再同期される）。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push retry $i"
            sleep 5
          done
          echo "::warning::state files のコミットに失敗しました（次回の実行で再同期されます）"

      - name: Notify on workflow failure
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request
          webhook = os.environ.get("NOTIFY_WEBHOOK")
          if not webhook:
              raise SystemExit(0)
          msg = "⚠️ Slot - open のワークフローが失敗しました。\n" + os.environ.get("RUN_URL", "")
          data = json.dumps({"content": msg, "text": msg}).encode("utf-8")
          req = urllib.request.Request(webhook, data=data, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=15)
          except Exception as e:
              print("通知の送信に失敗:", e)
          EOF
