name: Slot - open

on:
  schedule:
    # 17:00 JST = 08:00 UTC (time_jst は config.json の open スロットに合わせる)
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: slot-open
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Post story (open)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          CLOSED_DAYS_CSV_URL: ${{ secrets.CLOSED_DAYS_CSV_URL }}
        run: python post_story.py --slot open

      - name: Commit closed_days.txt if changed
        run: |
          if ! git diff --quiet -- closed_days.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add closed_days.txt
            git commit -m "chore: update closed_days.txt [skip ci]"
            git push
          else
            echo "closed_days.txt unchanged"
          fi
