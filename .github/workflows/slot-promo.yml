name: Slot - promo

on:
  schedule:
    # 実際の投稿目標は18:00 JST(09:00 UTC)。
    # ちょうど毎時0分はGitHub Actions全体で混雑し実行が遅延しやすいため、
    # 22分早い17:38 JST(08:38 UTC)に起動し、後続の待機ステップで正確な時刻まで調整する。
    - cron: "38 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: slot-promo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Wait until 18:00 JST (09:00 UTC)
        run: |
          TARGET_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 09:00:00" +%s)
          NOW_EPOCH=$(date -u +%s)
          SLEEP_SEC=$((TARGET_EPOCH - NOW_EPOCH))
          if [ "$SLEEP_SEC" -gt 0 ]; then
            echo "投稿予定時刻まで ${SLEEP_SEC} 秒待機します"
            sleep "$SLEEP_SEC"
          else
            echo "既に予定時刻を過ぎているため、待機せず投稿します"
          fi

      - name: Post story (promo)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          CLOSED_DAYS_CSV_URL: ${{ secrets.CLOSED_DAYS_CSV_URL }}
        run: python post_story.py --slot promo

      - name: Commit closed_days.txt if changed
        run: |
          if ! git diff --quiet -- closed_days.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add closed_days.txt
            git commit -m "chore: update closed_days.txt [skip ci]"
            git push
          else
            echo "closed_days.txt unchanged"
          fi
