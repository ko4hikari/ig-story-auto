name: Check IG Access Token

on:
  schedule:
    # 毎週月曜 12:00 JST = 03:00 UTC。トークン失効の早期検知が目的（自動更新はしない）。
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Facebookログイン方式のシステムユーザートークンは自動更新APIが存在しないため、
      # ここでは有効性チェックのみ行い、無効化されていれば NOTIFY_WEBHOOK 経由で通知する。
      # 失効時は Graph APIエクスプローラーから手動で再取得し、IG_ACCESS_TOKEN を更新する。
      - name: Check access token validity
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: python post_story.py --refresh-token
