name: Refresh IG Access Token

on:
  schedule:
    # 毎週月曜 12:00 JST = 03:00 UTC。トークンの有効期限(60日)に対して十分な頻度。
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # gh CLI は GitHub-hosted runner (ubuntu-latest) にプリインストール済み。
      # GH_TOKEN / GH_REPO を渡すと `gh secret set` がそれを使って認証する。
      - name: Refresh access token and update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python post_story.py --refresh-token
